<div class="w-full pb-16">
  <div class="container mx-auto px-4">
    <div class="max-w-4xl mx-auto">

      <!-- Not Found -->
      <ng-container *ngIf="!post">
        <div class="text-center py-16">
          <h2 class="text-2xl mb-4">Post not found</h2>
          <button
            (click)="goHome()"
            class="px-6 py-3 bg-[#3d4543] text-[#c8d946] rounded-full hover:bg-[#2d3533] transition-all"
          >
            Back to Home
          </button>
        </div>
      </ng-container>

      <!-- Post Card -->
      <ng-container *ngIf="post">
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
          <!-- Post Image -->
          <div class="relative w-full aspect-square bg-gray-100">
            <app-image-with-fallback
              [src]="post.image"
              [alt]="'Food Valley post ' + post.id"
              className="w-full h-full object-cover"
            ></app-image-with-fallback>
          </div>

          <!-- Post Details -->
          <div class="p-6 md:p-8">
            <!-- Account Info -->
            <div class="flex items-center gap-3 mb-4 pb-4 border-b">
              <div class="w-12 h-12 bg-gradient-to-br from-purple-600 to-pink-600 rounded-full flex items-center justify-center text-white font-bold">
                FV
              </div>
              <div>
                <h3 class="font-semibold">foodvalley.lucknow</h3>
                <p class="text-sm text-gray-500">{{ post.date }}</p>
              </div>
            </div>

            <!-- Caption -->
            <p class="text-gray-700 mb-6 text-lg leading-relaxed">{{ post.caption }}</p>

            <!-- Engagement Stats -->
            <div class="flex items-center gap-6 mb-6 pb-6 border-b">
              <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500 fill-red-500" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                <span class="font-medium">{{ formatLikes(post.likes) }}</span>
              </div>
              <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                <span class="font-medium">{{ post.comments }}</span>
              </div>
              <div class="flex items-center gap-2 ml-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                <span class="text-sm text-gray-500">{{ post.date }}</span>
              </div>
            </div>

            <!-- Location Tag -->
            <div class="bg-gray-50 rounded-lg p-4 mb-6">
              <p class="text-sm text-gray-600 flex items-center gap-2">
                <span class="text-lg">📍</span>
                <span>Food Valley, Vipin Khand, Gomti Nagar, Lucknow</span>
              </p>
            </div>

            <!-- Follow Button -->
            <a
              href="https://www.instagram.com/foodvalley.lucknow/"
              target="_blank"
              rel="noopener noreferrer"
              class="w-full flex items-center justify-center gap-3 px-8 py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-full text-lg hover:from-purple-700 hover:to-pink-700 transition-all shadow-lg hover:shadow-xl"
            >
              <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
              </svg>
              <span>Follow &#64;foodvalley.lucknow</span>
            </a>
          </div>
        </div>
      </ng-container>

    </div>
  </div>
</div>
